<!DOCTYPE html>
<html lang="en" style="font-size: 15.4125px;" class="hairlines">

<head>
    <meta charset="utf-8">
    <meta name="viewport"
          content="width=device-width,height=device-height,initial-scale=1,maximum-scale=1,minimum-scale=1,user-scalable=no">
    <title id="main_title">KuCoin</title>
    <style type="text/css">
      body {
        padding: 16px;
        font-family: 'KCNBFont', -apple-system,BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei';
        font-weight: 400;
      }

      h1 {
        font-size: 26px;
        color: #333333;
        letter-spacing: 0;
        line-height: 32px;
        margin: 0;
        font-weight: 500;
        word-break: break-word;
      }

      a {
        color: #0366d6;
        text-decoration: none;
        background-color: transparent;
      }

      .wrapper {
        margin: 0 auto;
        padding-bottom: 100px;
      }

      .title {
        word-break: break-word;
      }

      .time {
        font-size: 12px;
        color: #333333;
        letter-spacing: 0;
        margin-top: 8px;
        margin-bottom: 20px;
      }

      .ml-10 {
        margin-left: 10px;
      }

      .content {
        word-break: break-word;
        word-wrap: break-word;
      }

      .content img.size-full {
        max-width: 100%;
        width: 100%;
        height: 100%;
      }

      .content img {
        max-width: 100%;
      }

      .content table {
        border-collapse: collapse;
        border-spacing: 0;
        margin-top: 0;
        margin-bottom: 16px;
        display: table;
        width: 100%;
        overflow: auto;
      }
      .content table th {
        font-weight: 600;
      }
      .content table th,
      .content table td {
        padding: 4px;
        border: 1px solid #dfe2e5;
        word-break: break-all;
        border-collapse: collapse;
      }
      .content table tr {
        background-color: #fff;
        border-top: 1px solid #c6cbd1;
      }
      .content table tr:nth-child(2n) {
        background-color: #f6f8fa;
      }
    </style>
</head>

<body>
<div class="wrapper">
    <div class="article">
        <h1 id="id_title" class="title"></h1>
        <div class="time">
            <span id="id_time"></span>
            <span id="id_category" class="ml-10"></span>
        </div>
        <div id="id_content" class="content">
        </div>
    </div>
</div>
</body>

</html>
